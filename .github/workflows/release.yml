name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: freee-printer-linux-x86_64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            asset: freee-printer-linux-aarch64
          - os: macos-latest
            target: aarch64-apple-darwin
            asset: freee-printer-macos-arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: freee-printer-windows-x86_64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release -p freee-printer --target ${{ matrix.target }}
      - name: Name the binary
        shell: bash
        run: |
          src=target/${{ matrix.target }}/release/freee-printer
          [ -f "$src.exe" ] && src="$src.exe"
          cp "$src" "${{ matrix.asset }}"
      - uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.asset }}
